# Brand file for QSnippet (https://github.com/queball1999/QSnippet).
#
# Compiled into updater.exe at build time by tools/build_branded.py. This is
# the reference example of a complete brand; the copy QSnippet actually ships
# lives in the QSnippet repository as updater-brand.yaml.
#
# Values set here become defaults for the branded binary. Security-critical
# fields are automatically LOCKED, meaning a config.yaml dropped next to the
# binary cannot override them. See docs/SECURITY.md.

app:
  name: QSnippet
  publisher: Quynn Bell
  support_url: https://qsnippet.com
  process_names:
    - QSnippet.exe
    - QSnippet

source:
  provider: github
  repo: queball1999/QSnippet
  channel: stable
  # Only consider release-channel tags, not the -windows / -linux standalone
  # build tags the pipeline also pushes.
  tag_pattern: "-release$"

assets:
  # Left to automatic platform detection, which resolves to:
  #   Windows  -> QSnippet-*-windows-installer.exe
  #   Debian   -> QSnippet_*_amd64.deb
  #   Fedora   -> the .rpm once the pipeline publishes one
  #   AppImage -> the .AppImage when running from one
  preference: []
  exclude_pattern: "portable"

security:
  require_signature: true
  require_checksum: true
  checksum_file: SHA256SUMS.txt
  signature_suffixes: [".sig", ".asc"]

  # The public key is injected at build time with --key, so it is compiled
  # into the binary rather than read from a file on the target machine.
  public_key_file: ""

  # Pin the release signing key. Both the primary key and its signing subkey
  # are listed, because either may sign a given release.
  allowed_fingerprints:
    - 0E33B487E4193A20AB494B29F70C9E44B78E7B7C
    - ECE5FCEFD34AE17664F1C6F897CDE457CD97410F

install:
  mode: silent
  elevate: auto
  installer_args:
    # QSnippet ships an Inno Setup installer.
    exe: ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
    exe_interactive: []

process:
  stop_parent: true
  stop_timeout: 30
  relaunch: true
  wait_before_relaunch: 2

notes:
  # QSnippet keeps user-facing release notes in notices/*.yaml, which is
  # exactly what the notices source reads.
  source: auto
  notices_dir: notices

ui:
  window_title: QSnippet Updater
  accent_color: "#4C8BF5"
  auto_close_seconds: 3

logging:
  level: INFO
  # Left empty so the default per-OS location is used unless QSnippet passes
  # --log-file pointing at its own log directory, which it does.
  file: ""

# Additional fields to freeze beyond the security-critical defaults.
# Locking the channel stops a dropped-in config file quietly moving a user
# onto a prerelease channel.
lock:
  - source.channel
  - source.tag_pattern
  - install.elevate
